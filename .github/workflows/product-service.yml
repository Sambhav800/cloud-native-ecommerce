name: Product Service CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'src/product-service/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/product-service/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Build with Maven
      working-directory: ./src/product-service
      run: mvn -B package --file pom.xml
      
    - name: Login to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}
        
    - name: Build and push Docker image
      working-directory: ./src/product-service
      run: |
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/product-service:${{ github.sha }} .
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/product-service:${{ github.sha }}
        
    - name: Deploy to AKS
      uses: azure/k8s-deploy@v1
      with:
        namespace: ecommerce
        manifests: |
          kubernetes/base/product-deployment.yaml
          kubernetes/base/product-service.yaml
        images: |
          ${{ secrets.ACR_LOGIN_SERVER }}/product-service:${{ github.sha }}
