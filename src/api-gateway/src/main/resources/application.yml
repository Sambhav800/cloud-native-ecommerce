server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: http://product-service
          predicates:
            - Path=/api/products/**
        - id: user-service
          uri: http://user-service
          predicates:
            - Path=/api/users/**,/api/auth/**
        - id: cart-service
          uri: http://cart-service
          predicates:
            - Path=/api/carts/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: gateway
